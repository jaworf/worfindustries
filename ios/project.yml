name: RiverviewMinistry

options:
  bundleIdPrefix: org.riverviewadventist
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Riverview Ministry
    INFOPLIST_KEY_CFBundleDisplayName: Riverview Ministry
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Pasco Riverview Adventist Church
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    CODE_SIGN_STYLE: Automatic

targets:
  RiverviewMinistry:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: RiverviewMinistry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.riverviewadventist.ministry
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - sdk: PDFKit.framework
      - sdk: Security.framework

  RiverviewMinistryTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: RiverviewMinistryTests
    dependencies:
      - target: RiverviewMinistry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.riverviewadventist.ministry.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  RiverviewMinistry:
    build:
      targets:
        RiverviewMinistry: all
        RiverviewMinistryTests:
          - test
    test:
      targets:
        - RiverviewMinistryTests
