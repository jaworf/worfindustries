name: RiverviewMinistry

options:
  bundleIdPrefix: org.riverviewadventist
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    CC: "$(SRCROOT)/Tools/clang-probe-wrapper.sh"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Pasco Riverview Adventist Church
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    CODE_SIGN_STYLE: Automatic

targets:
  RiverviewMinistry:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: RiverviewMinistry
    settings:
      base:
        PRODUCT_NAME: Riverview Ministry Volunteers
        PRODUCT_MODULE_NAME: RiverviewMinistry
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: RiverviewMinistry/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.riverviewadventist.ministry
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: W3T4AK7599
        # A stable signing identity lets macOS recognize rebuilt versions of the
        # app as the same trusted Keychain client.
        "CODE_SIGN_STYLE[sdk=macosx*]": Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - sdk: PDFKit.framework
      - sdk: Security.framework

  RiverviewMinistryTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: RiverviewMinistryTests
    dependencies:
      - target: RiverviewMinistry
    settings:
      base:
        PRODUCT_NAME: RiverviewMinistryTests
        PRODUCT_BUNDLE_IDENTIFIER: org.riverviewadventist.ministry.tests
        DEVELOPMENT_TEAM: W3T4AK7599
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Riverview Ministry Volunteers.app/Riverview Ministry Volunteers"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Riverview Ministry Volunteers.app/Contents/MacOS/Riverview Ministry Volunteers"

schemes:
  RiverviewMinistry:
    build:
      targets:
        RiverviewMinistry: all
        RiverviewMinistryTests:
          - test
    test:
      targets:
        - RiverviewMinistryTests
